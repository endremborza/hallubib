[project]
name = "hallubib"
description = "Check bibliography for hallucinations"
dynamic = ["version"]
authors = [{name = "Endre Márk Borza", email = "endremborza@gmail.com"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
hallubib = "hallubib.cli:main"

[project.urls]
Homepage = "https://github.com/endremborza/hallubib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "hallubib/__init__.py"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that require network access"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
